name: CI — agent-cli

on:
  push:
    branches: [dev]
    paths: ['cli/**', '.github/workflows/ci-cli.yml']
  pull_request:
    paths: ['cli/**', '.github/workflows/ci-cli.yml']

permissions:
  contents: read

jobs:
  test:
    # Fork PRs run on GitHub-hosted runners (no access to self-hosted infra);
    # internal pushes use the self-hosted runner.
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || 'anton' }}
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install agent-core (dependency)
        run: python3 -m pip install -e "../core/"

      - name: Install dependencies
        run: python3 -m pip install -e ".[dev]"

      - name: Lint
        run: python3 -m ruff check src/ tests/

      - name: Test with coverage
        run: python3 -m pytest --cov=src/agent_cli --cov-report=xml --cov-report=term-missing -v

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-cli
          path: cli/coverage.xml
