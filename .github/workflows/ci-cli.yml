name: CI — agent-cli

on:
  push:
    branches: [dev]
    paths: ['cli/**', '.github/workflows/ci-cli.yml']
  pull_request:
    paths: ['cli/**', '.github/workflows/ci-cli.yml']

jobs:
  test:
    runs-on: anton
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install agent-core (dependency)
        run: pip install -e "../core/"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src/ tests/

      - name: Test with coverage
        run: pytest --cov=src/agent_cli --cov-report=xml --cov-report=term-missing -v

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-cli
          path: cli/coverage.xml
