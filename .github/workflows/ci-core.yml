name: CI — agent-core

on:
  push:
    branches: [main]
    paths: ['core/**', 'cli/**', '.github/workflows/ci-core.yml']
  pull_request:
    paths: ['core/**', 'cli/**', '.github/workflows/ci-core.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src/ tests/

      - name: Type check
        run: mypy src/

      - name: Test with coverage
        run: pytest --cov=src/agent_core --cov-report=xml --cov-report=term-missing -v

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-core
          path: core/coverage.xml
