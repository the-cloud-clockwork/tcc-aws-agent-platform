name: CI — agent-core

on:
  push:
    branches: [dev]
    paths: ['core/**', 'cli/**', '.github/workflows/ci-core.yml']
  pull_request:
    paths: ['core/**', 'cli/**', '.github/workflows/ci-core.yml']

permissions:
  contents: read

jobs:
  test:
    # Fork PRs run on GitHub-hosted runners (no access to self-hosted infra);
    # internal pushes use the self-hosted runner.
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || 'anton' }}
    env:
      AWS_DEFAULT_REGION: eu-west-1
      BEDROCK_REGION: us-west-2
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies (all optional extras)
        run: |
          python3 -m pip install -e ".[dev,runtime,cache,observability,anthropic,litellm,structured_output,presidio,evaluation_langfuse]"

      - name: Lint
        run: python3 -m ruff check src/ tests/

      - name: Type check (non-blocking — baseline has pre-existing drift)
        run: python3 -m mypy src/
        continue-on-error: true

      - name: Test with coverage
        run: python3 -m pytest --cov=src/agent_core --cov-report=xml --cov-report=term-missing -v

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-core
          path: core/coverage.xml
