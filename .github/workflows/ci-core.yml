name: CI — agent-core

on:
  push:
    branches: [main]
    paths: ['core/**', 'cli/**', '.github/workflows/ci-core.yml']
  pull_request:
    paths: ['core/**', 'cli/**', '.github/workflows/ci-core.yml']

jobs:
  test:
    runs-on: anton
    env:
      AWS_DEFAULT_REGION: eu-west-1
      BEDROCK_REGION: us-west-2
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies (all optional extras)
        run: |
          pip install -e ".[dev,runtime,cache,observability,anthropic,litellm,structured_output,presidio,evaluation_langfuse]"

      - name: Lint
        run: ruff check src/ tests/

      - name: Type check (non-blocking — baseline has pre-existing drift)
        run: mypy src/
        continue-on-error: true

      - name: Test with coverage
        run: pytest --cov=src/agent_core --cov-report=xml --cov-report=term-missing -v

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-core
          path: core/coverage.xml
