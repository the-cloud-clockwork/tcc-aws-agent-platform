name: CI — agent-infra

on:
  push:
    branches: [main]
    paths: ['infra/**', '.github/workflows/ci-infra.yml']
  pull_request:
    paths: ['infra/**', '.github/workflows/ci-infra.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Node.js (CDK)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install CDK CLI
        run: npm install -g aws-cdk

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check stacks/ constructs_/ tests/

      - name: Test
        run: pytest -v

      - name: CDK synth (validate templates)
        run: cdk synth -c env=dev --no-lookups 2>/dev/null || echo "CDK synth requires AWS context — skipped in CI"
