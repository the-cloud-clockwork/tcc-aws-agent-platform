name: CI — prompt-registry

on:
  push:
    branches: [main]
    paths: ['prompts/**', '.github/workflows/ci-prompts.yml']
  pull_request:
    paths: ['prompts/**', '.github/workflows/ci-prompts.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prompts
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src/ tests/

      - name: Test with coverage
        run: pytest --cov=src/prompt_registry --cov-report=xml --cov-report=term-missing -v

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-prompts
          path: prompts/coverage.xml
