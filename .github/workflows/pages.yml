name: Deploy GitHub Pages

# Docs site deploys from main (the released/stable branch). The github-pages
# environment's deployment-branch policy allows only main, so triggering on
# main keeps the public site = released state and avoids the dev-deploy
# rejection that the old sample workflow hit on every push.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "index.md"
      - "_config.yml"
      - "_layouts/**"
      - "_includes/**"
      - "_sass/**"
      - "assets/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: anton
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: anton
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
