name: Publish to CodeArtifact

on:
  push:
    branches: [main]
    paths:
      - 'core/**'
      - 'prompts/**'
      - '.github/workflows/publish.yml'

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component:
          - { name: core,    package: agent-core,      script: core/scripts/publish-wheel.sh }
          - { name: prompts, package: prompt-registry, script: "" }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-west-1

      - name: Install build tools
        run: pip install build twine

      # ── fixed-version flow (preferred) ──
      # Components with a publish-wheel.sh use delete-then-republish so the
      # version label stays fixed (e.g. agent-core 1.0.0) across dev iterations.
      - name: Publish via script
        if: matrix.component.script != ''
        run: ${{ matrix.component.script }}

      # ── legacy semver flow (fallback) ──
      - name: Build ${{ matrix.component.package }} (legacy)
        if: matrix.component.script == ''
        working-directory: ${{ matrix.component.name }}
        run: python -m build

      - name: Publish ${{ matrix.component.package }} (legacy)
        if: matrix.component.script == ''
        working-directory: ${{ matrix.component.name }}
        run: |
          TOKEN=$(aws codeartifact get-authorization-token \
            --domain platform --domain-owner 835618032093 \
            --query authorizationToken --output text)
          TWINE_USERNAME=aws TWINE_PASSWORD="$TOKEN" \
            twine upload \
              --repository-url https://platform-835618032093.d.codeartifact.eu-west-1.amazonaws.com/pypi/platform-python/ \
              dist/*
