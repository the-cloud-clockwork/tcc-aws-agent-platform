name: Publish to CodeArtifact

# Republishes the agent-core wheel to CodeArtifact on every push to dev
# that touches core/. Version stays pinned at 1.0.0 — publish-wheel.sh
# deletes the existing version and re-uploads a fresh wheel.
# dev is the deploy source of truth; main is a vestigial snapshot.

on:
  push:
    branches: [dev]
    paths:
      - 'core/**'
      - '.github/workflows/publish.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_DEFAULT_REGION: eu-west-1

jobs:
  publish-core:
    runs-on: anton
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: pip install build twine

      - name: Publish agent-core via publish-wheel.sh
        run: |
          # Resolve the account id at runtime from the configured AWS creds,
          # so it is not hardcoded in the public repo.
          export CODEARTIFACT_DOMAIN_OWNER="$(aws sts get-caller-identity --query Account --output text)"
          ./core/scripts/publish-wheel.sh
