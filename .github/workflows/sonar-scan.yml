name: SonarQube Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  sonar:
    uses: The-Cloud-Clock-Work/.github/.github/workflows/sonar-reusable.yml@main
    with:
      python_version: "3.12"
      install_command: |
        pip install -e "core/[dev]" -e "prompts/[dev]" -e "artifacts/[dev]" -e "cli/[dev]"
      test_command: |
        cd core && pytest --cov=src/agent_core --cov-report=xml -q && cd ..
        cd prompts && pytest --cov=src/prompt_registry --cov-report=xml -q && cd ..
        cd artifacts && pytest --cov=src/mcp_artifacts --cov-report=xml -q && cd ..
        cd cli && pytest --cov=src/agent_cli --cov-report=xml -q && cd ..
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
