name: Workflow locality

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject private organization workflow dependencies
        run: |
          if grep -RniE 'uses:.*the-cloud-clockwork/\.github/' .github/workflows; then
            exit 1
          fi
