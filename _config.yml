title: AWS Agent Platform
description: >-
  Configuration-driven, domain-agnostic runtime for declaring AI agents
  in YAML and deploying them on AWS — built over Strands Agents SDK
  and Amazon Bedrock AgentCore.
url: "https://the-cloud-clock-work.github.io"
baseurl: "/tccw-aws-agent-platform"

remote_theme: just-the-docs/just-the-docs@v0.10.0

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-sitemap

color_scheme: dark
search_enabled: true
search.heading_level: 3

mermaid:
  version: "11"

aux_links:
  GitHub: "https://github.com/The-Cloud-Clock-Work/tccw-aws-agent-platform"
aux_links_new_tab: true

gh_edit_link: true
gh_edit_link_text: "Edit this page on GitHub"
gh_edit_repository: "https://github.com/The-Cloud-Clock-Work/tccw-aws-agent-platform"
gh_edit_branch: "main"
gh_edit_view_mode: "edit"

footer_content: >-
  AWS Agent Platform is maintained by
  <a href="https://github.com/The-Cloud-Clock-Work">The Cloud Clock Work</a>.
  Built on <a href="https://aws.amazon.com/bedrock/agentcore/">Amazon Bedrock AgentCore</a>
  and <a href="https://github.com/strands-agents/sdk-python">Strands Agents SDK</a>.

back_to_top: true
back_to_top_text: "Back to top"

defaults:
  - scope:
      path: ""
    values:
      layout: "default"
  - scope:
      path: "docs"
    values:
      layout: "default"
  - scope:
      path: "docs/getting-started"
    values:
      parent: "Getting Started"
  - scope:
      path: "docs/architecture"
    values:
      parent: "Architecture"
  - scope:
      path: "docs/sdk"
    values:
      parent: "SDK Reference"
  - scope:
      path: "docs/infrastructure"
    values:
      parent: "Infrastructure"
  - scope:
      path: "docs/cli"
    values:
      parent: "CLI Reference"
  - scope:
      path: "docs/blueprints"
    values:
      parent: "Blueprints"
  - scope:
      path: "docs/concepts"
    values:
      parent: "Concepts"

exclude:
  - core/
  - prompts/
  - artifacts/
  - cli/
  - modules/
  - scripts/
  - resources/
  - "*.py"
  - "*.pyc"
  - __pycache__/
  - "*.egg-info"
  - dist/
  - build/
  - .venv/
  - venv/
  - .env
  - "*.tf"
  - "*.tfvars"
  - "*.hcl"
  - pyproject.toml
  - ruff.toml
  - sonar-project.properties
  - CLAUDE.md
  - POSTMORTEM.md
  - INFRA.md
  - INFRA-PATCH.md
  - README.md
  - "*.log"
  - "*.zip"
  - .github/workflows/ci-core.yml
  - .github/workflows/ci-prompts.yml
  - .github/workflows/ci-artifacts.yml
  - .github/workflows/ci-cli.yml
  - .github/workflows/publish.yml
  - .github/workflows/sonar-scan.yml
