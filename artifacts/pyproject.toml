[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-artifacts"
version = "0.1.0"
description = "Artifact store library — claim-check pattern for agent outputs (S3 + DynamoDB)"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    {name = "The Cloud Clockwork"},
]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Development Status :: 4 - Beta",
]
dependencies = [
    "boto3>=1.34.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "moto[s3,dynamodb]>=5.0.0",
    "ruff>=0.4,<1",
]

[project.urls]
Homepage = "https://github.com/The-Cloud-Clockwork/tcc-aws-agent-platform"
Documentation = "https://the-cloud-clockwork.github.io/tcc-aws-agent-platform"
Source = "https://github.com/The-Cloud-Clockwork/tcc-aws-agent-platform"
Issues = "https://github.com/The-Cloud-Clockwork/tcc-aws-agent-platform/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_artifacts"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
