[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-artifacts"
version = "0.1.0"
description = "Artifacts MCP Server — universal output pipeline for all agents"
requires-python = ">=3.11"
dependencies = [
    "agent-core>=0.7.0",
    "mcp[server]>=1.0.0",
    "boto3>=1.34.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "moto[s3,dynamodb]>=5.0.0",
    "ruff>=0.4,<1",
    "uvicorn>=0.27.0",
    "starlette>=0.27",
]

[project.scripts]
mcp-artifacts = "mcp_artifacts.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_artifacts"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
