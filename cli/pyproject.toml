[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-cli"
version = "0.1.0"
description = "Agent CLI tool for prompt management, blueprint validation, and graph rendering"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    {name = "The Cloud Clockwork"},
]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Development Status :: 4 - Beta",
]
dependencies = [
    "typer>=0.26.7",
    "rich>=13.7.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.1",
    "agent-core>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4,<1",
]

[project.urls]
Homepage = "https://github.com/The-Cloud-Clockwork/tcc-aws-agent-platform"
Documentation = "https://the-cloud-clockwork.github.io/tcc-aws-agent-platform"
Source = "https://github.com/The-Cloud-Clockwork/tcc-aws-agent-platform"
Issues = "https://github.com/The-Cloud-Clockwork/tcc-aws-agent-platform/issues"

[project.scripts]
agentcli = "agent_cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
