[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-core"
version = "1.0.0"
description = "Agent Core -- Blueprint Engine, Execution Modes, Hooks, Schemas, Gateway, Memory, Identity, Policy"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "pydantic>=2.6,<3",
    "pyyaml>=6.0,<7",
    "httpx>=0.27,<1",
    "mcp>=1.10.0",
    "mcp-proxy-for-aws>=1.1.0",
    "strands-agents[otel]>=1.0.0,<2",
    "strands-agents-tools>=0.3.0",
    "bedrock-agentcore>=0.1.0",
    "starlette>=0.37,<1",
    "langfuse>=2.0,<3",
]

[project.optional-dependencies]
runtime = [
    "boto3>=1.35",
]
cache = [
    "redis>=5.0,<6",
]
observability = [
    "aws-xray-sdk>=2.12,<3",
    "boto3>=1.34,<2",
]
anthropic = [
    "anthropic>=0.30,<1",
]
litellm = [
    "litellm>=1.83.0,<2",  # Pin >=1.83.0: versions 1.82.7-1.82.8 were supply chain attack (CVE-2026-33634)
]
structured_output = [
    "instructor>=1.10,<2",
    "openai>=1.50,<3",
]
presidio = [
    "presidio-analyzer>=2.2,<3",
    "presidio-anonymizer>=2.2,<3",
]
evaluation_langfuse = [
    "langfuse>=2.0,<4",
]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.23,<1",
    "pytest-cov>=5.0,<6",
    "ruff>=0.4,<1",
    "mypy>=1.10,<2",
    "types-PyYAML>=6.0,<7",
    "respx>=0.21,<1",
    "moto[dynamodb,sns]>=5.0,<6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_core"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = false
warn_unused_configs = true
warn_unused_ignores = false
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["strands.*", "strands_tools.*", "langfuse.*", "aws_xray_sdk.*", "boto3.*", "botocore.*", "moto.*", "bedrock_agentcore.*", "redis.*", "uvicorn.*", "starlette.*", "mcp.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[[tool.mypy.overrides]]
module = [
    "agent_core.memory.manager",
    "agent_core.identity.providers",
    "agent_core.agentcore.*",
]
disallow_untyped_defs = false
disable_error_code = ["assignment", "call-arg", "attr-defined"]

[[tool.mypy.overrides]]
module = [
    "agent_core.observability.xray_tracing",
    "agent_core.observability.structured_logger",
]
disable_error_code = ["type-arg", "arg-type"]

[[tool.mypy.overrides]]
module = ["agent_core.runtime.entrypoint"]
disallow_untyped_defs = false
disable_error_code = ["type-arg", "attr-defined", "no-untyped-def"]

[[tool.mypy.overrides]]
module = ["agent_core.runtime.strands_session_bridge"]
disable_error_code = ["override"]

[[tool.mypy.overrides]]
module = ["agent_core.runtime.session"]
disable_error_code = ["assignment", "attr-defined"]

# ── Pre-existing strictness hotspots ──
# These modules accumulate mypy noise from upstream SDK type stubs
# (`bedrock_agentcore.identity.*` signatures drift, `mcp.*` generics
# aren't parameterised, `mcp_proxy_for_aws.client` has no py.typed).
# Overrides keep CI green without suppressing errors in business logic.

[[tool.mypy.overrides]]
module = [
    "instructor.*",
    "openai.*",
    "presidio_analyzer.*",
    "presidio_anonymizer.*",
    "mcp_proxy_for_aws.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["agent_core.identity.*", "agent_core.identity.client"]
disable_error_code = ["arg-type", "no-untyped-call", "attr-defined"]

[[tool.mypy.overrides]]
module = ["agent_core.mcp.base_server"]
disable_error_code = ["type-arg", "no-untyped-def", "no-untyped-call", "union-attr"]

[[tool.mypy.overrides]]
module = ["agent_core.gateway.client", "agent_core.gateway.direct_mcp_client"]
disable_error_code = ["arg-type", "no-untyped-def", "import-untyped"]

[[tool.mypy.overrides]]
module = ["agent_core.tools.wiring"]
disable_error_code = ["assignment"]

[[tool.mypy.overrides]]
module = ["agent_core.blueprints.session"]
disable_error_code = ["return-value", "exit-return"]

[[tool.mypy.overrides]]
module = ["agent_core.blueprints.loader"]
disable_error_code = ["assignment", "type-arg", "has-type"]

[[tool.mypy.overrides]]
module = [
    "agent_core.policy",
    "agent_core.evaluation",
    "agent_core.a2a",
]
disable_error_code = ["no-untyped-def"]
