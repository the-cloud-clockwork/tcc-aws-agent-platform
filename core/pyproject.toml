[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-core"
version = "0.9.9"
description = "Agent Core -- Blueprint Engine, Execution Modes, Hooks, Schemas, Gateway, Memory, Identity, Policy"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "pydantic>=2.6,<3",
    "pyyaml>=6.0,<7",
    "httpx>=0.27,<1",
    "mcp>=1.10.0",
    "mcp-proxy-for-aws>=1.1.0",
    "strands-agents>=1.0.0,<2",
    "strands-agents-tools>=0.1.0",
    "bedrock-agentcore>=0.1.0",
    "starlette>=0.37,<1",
]

[project.optional-dependencies]
runtime = [
    "boto3>=1.35",
]
cache = [
    "redis>=5.0,<6",
]
observability = [
    "langfuse>=2.0,<3",
    "aws-xray-sdk>=2.12,<3",
    "boto3>=1.34,<2",
]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.23,<1",
    "pytest-cov>=5.0,<6",
    "ruff>=0.4,<1",
    "mypy>=1.10,<2",
    "types-PyYAML>=6.0,<7",
    "respx>=0.21,<1",
    "moto[dynamodb,sns]>=5.0,<6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_core"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = false
warn_unused_configs = true
warn_unused_ignores = false
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["strands.*", "strands_tools.*", "langfuse.*", "aws_xray_sdk.*", "boto3.*", "botocore.*", "moto.*", "bedrock_agentcore.*", "redis.*", "uvicorn.*", "starlette.*", "mcp.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[[tool.mypy.overrides]]
module = [
    "agent_core.memory.manager",
    "agent_core.identity.providers",
    "agent_core.agentcore.*",
]
disallow_untyped_defs = false
disable_error_code = ["assignment", "call-arg", "attr-defined"]

[[tool.mypy.overrides]]
module = [
    "agent_core.observability.xray_tracing",
    "agent_core.observability.structured_logger",
]
disable_error_code = ["type-arg", "arg-type"]

[[tool.mypy.overrides]]
module = ["agent_core.runtime.entrypoint"]
disallow_untyped_defs = false
disable_error_code = ["type-arg", "attr-defined", "no-untyped-def"]

[[tool.mypy.overrides]]
module = ["agent_core.runtime.strands_session_bridge"]
disable_error_code = ["override"]

[[tool.mypy.overrides]]
module = ["agent_core.runtime.session"]
disable_error_code = ["assignment", "attr-defined"]
