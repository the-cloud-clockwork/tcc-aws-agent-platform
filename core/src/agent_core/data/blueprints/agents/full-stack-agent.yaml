# Full-stack agent — Blocks 1-8 combined
#
# Demonstrates every implemented block wired together:
#   Block 1: AgentCore Runtime (microVM, port 8080, @app.entrypoint)
#   Block 2: Gateway (MCP tools via single Gateway URL)
#   Block 3: Identity (JWT inbound, OAuth outbound)
#   Block 4: Memory (short-term + long-term with strategies)
#   Block 5: Tools (Code Interpreter + Browser + Gateway MCP)
#   Block 6: Observability (OTEL, Langfuse, audit, dashboard, data protection)
#   Block 7: Evaluation (custom evaluator + online monitoring)
#   Block 8: Policy (Cedar access control on Gateway)
#
# Extended thinking enabled for complex reasoning tasks.

id: full-stack-agent
name: Full-Stack Analysis Agent
version: "1.0.0"
description: Agent combining all implemented blocks — runtime, gateway, identity, memory, builtin tools.

model:
  provider: bedrock
  model_id: us.anthropic.claude-sonnet-4-20250514-v1:0
  max_tokens: 16384
  temperature: 0.1

thinking:
  enabled: true
  budget_tokens: 10000

prompt_ref: full-stack-agent-system-v1

tools:
  - builtin: code_interpreter
    network_mode: PRIVATE
  - builtin: browser
  - mcp: data-source-mcp
    tools:
      - query_data
      - list_datasets
      - get_schema
  - mcp: artifacts-mcp
    tools:
      - create_artifact
      - get_artifact
      - list_artifacts

gateway:
  auth_type: custom_jwt
  jwt_env_var: USER_JWT_TOKEN

identity:
  authorizer:
    type: custom_jwt
    discovery_url: https://cognito-idp.${AWS_REGION}.amazonaws.com/${USER_POOL_ID}/.well-known/openid-configuration
    allowed_clients:
      - ${COGNITO_CLIENT_ID}
  credentials:
    - name: external_data_provider
      type: oauth2
      provider: DataProviderOAuth
      scopes:
        - read
      auth_flow: m2m

memory:
  mode: MANAGED
  strategies:
    - type: SEMANTIC
      name: FactExtractor
      namespace: "user/{actorId}/facts/"
    - type: SUMMARY
      name: SessionSummarizer
      namespace: "user/{actorId}/{sessionId}/summaries/"
  event_expiry_days: 90
  short_term_k: 10
  enable_tool_provider: true
  retrieval:
    - namespace: "user/{actorId}/facts/"
      top_k: 5
      relevance_score: 0.3

observability:
  trace_attributes:
    team: platform
    tier: production
  langfuse:
    tags:
      - full-stack
      - production
  audit_log:
    ttl_days: 1825
  dashboard:
    metric_namespace: AgentPlatform
  data_protection:
    cloudwatch_masking_identifiers:
      - EmailAddress
      - CreditCardNumber
      - USPhoneNumber


evaluation:
  custom_evaluators:
    - name: analysis_quality
      level: TRACE
      model_id: ${EVAL_JUDGE_MODEL_ID}
      max_tokens: 500
      temperature: 1.0
      instructions: >
        Evaluate the quality of the analysis provided.
        Consider accuracy, depth, and actionability.

        Context: {context}
        Assistant response: {assistant_turn}
      rating_scale:
        - value: 1.0
          label: Excellent
          definition: Thorough, accurate, and actionable analysis.
        - value: 0.5
          label: Adequate
          definition: Partially addresses the analysis needs.
        - value: 0.0
          label: Poor
          definition: Inaccurate or unhelpful analysis.

  online:
    sampling_rate: ${EVAL_SAMPLING_RATE}
    evaluators:
      - Builtin.GoalSuccessRate
      - Builtin.Correctness
      - Builtin.ToolParameterAccuracy

policy:
  engine: FullStackPolicies
  mode: LOG_ONLY
  rules:
    - name: allow_data_queries
      allow: query_data
    - name: limit_data_export
      allow: export_data
      when: "context.input.row_limit <= 10000"
    - name: admins_only_delete
      deny: delete_record
      unless: "principal.scope.contains('group:Admins')"
runtime:
  type: agentcore
  max_iterations: 15
  idle_timeout_minutes: 30
  network_mode: PRIVATE
  protocol: HTTP

execution_modes:
  simulation: true
  staging: true
  production: true

output_schema: AnalysisOutput

hooks:
  - observability

artifacts:
  tier: platform
  type: analysis_result
