# Observable agent — Block 1 + Block 2 + Block 6 (Observability)
#
# Demonstrates:
#   Block 1: AgentCore Runtime (microVM, port 8080, @app.entrypoint)
#   Block 2: Gateway (MCP tools via single Gateway URL)
#   Block 6: Observability (OTEL, trace_attributes, Langfuse, audit, dashboard, data protection)

id: observable-agent
name: Observable Analysis Agent
version: "1.0.0"
description: Agent with full observability stack — OTEL tracing, Langfuse, audit log, data protection.

model:
  provider: bedrock
  model_id: us.anthropic.claude-sonnet-4-20250514-v1:0
  max_tokens: 4096
  temperature: 0.1

prompt_ref: observable-agent-system-v1

tools:
  - mcp: data-source-mcp
    tools:
      - query_data
      - list_datasets
  - mcp: artifacts-mcp
    tools:
      - create_artifact

gateway:
  auth_type: aws_iam

observability:
  trace_attributes:
    team: platform
    tier: production
    component: analysis
  langfuse:
    tags:
      - analysis
      - production
  audit_log:
    ttl_days: 365
  dashboard:
    metric_namespace: AgentPlatform
    log_group_prefix: agents/
    custom_metrics:
      - QueryCount
      - ArtifactCreated
  data_protection:
    cloudwatch_masking_identifiers:
      - EmailAddress
      - CreditCardNumber

runtime:
  type: agentcore
  max_iterations: 10
  idle_timeout_minutes: 15
  network_mode: PUBLIC
  protocol: HTTP
  observability_enabled: true

execution_modes:
  simulation: true
  staging: true
  production: true

hooks:
  - observability

artifacts:
  tier: platform
  type: analysis_result
