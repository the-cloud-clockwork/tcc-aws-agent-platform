# Dev environment configuration
# Usage: cdk deploy -c env=dev

environment: dev
account: "835618032093"
region: eu-west-1
bedrock_region: us-west-2

resource_prefix: "platform"
service_discovery_namespace: "platform.local"
ssm_root_path: "/platform/dev"

execution_mode: simulation

vpc:
  max_azs: 2
  nat_gateways: 1

scaling:
  fargate:
    min_tasks: 1
    max_tasks: 2
    target_cpu_percent: 70
  lambda:
    provisioned_concurrency: 0  # No provisioned concurrency in dev
    provisioned_agents: ["portfolio-recommender"]

dynamodb:
  billing_mode: PAY_PER_REQUEST  # On-demand for dev (unpredictable usage)

s3:
  intelligent_tiering: false  # Not worth it for dev
  removal_policy: DESTROY

logs:
  retention_days: 14

mcp_services:
  cpu: 256
  memory_mib: 512
  desired_count: 1

lambda_agents:
  memory_size: 1024
  timeout_minutes: 15

waf:
  enabled: false  # No WAF in dev

secrets:
  rotation_days: 0  # No rotation in dev

# Data resources — stacks read from config, not hardcoded
tables:
  artifacts:
    partition_key: artifact_id
  audit_log:
    partition_key: audit_id
    sort_key: timestamp
  prompt_registry:
    partition_key: prompt_id
    sort_key: version
  run_history:
    partition_key: run_date
    sort_key: execution_id
  idempotency:
    partition_key: idempotency_key
    ttl_attribute: expires_at

buckets:
  - artifacts
  - historical-data
  - prompt-registry

agents:
  - name: gap-detector
    handler: qitp_agents.gap_detector.handler.handler
    memory: 1024
    timeout: 900
  - name: sentiment-analyzer
    handler: qitp_agents.sentiment_analyzer.handler.handler
    memory: 1024
    timeout: 900
  - name: strategy-evaluator
    handler: qitp_agents.strategy_evaluator.handler.handler
    memory: 1024
    timeout: 900
  - name: portfolio-recommender
    handler: qitp_agents.portfolio_recommender.handler.handler
    memory: 2048
    timeout: 900
  - name: technical-analyzer
    handler: qitp_agents.technical_analyzer.handler.handler
    memory: 1024
    timeout: 900
  - name: ml-predictor
    handler: qitp_agents.ml_predictor.handler.handler
    memory: 1024
    timeout: 900
  - name: watchlist-screener
    handler: qitp_agents.watchlist_screener.handler.handler
    memory: 1024
    timeout: 900
  - name: tax-reporter
    handler: qitp_agents.tax_reporter.handler.handler
    memory: 1024
    timeout: 900

mcps:
  - name: artifacts
    port: 8080
    cpu: 256
    memory: 512
  - name: market-data
    port: 8080
    cpu: 256
    memory: 512
  - name: sentiment
    port: 8080
    cpu: 256
    memory: 512
  - name: technical
    port: 8080
    cpu: 256
    memory: 512
  - name: backtest
    port: 8080
    cpu: 256
    memory: 512
  - name: charting
    port: 8080
    cpu: 256
    memory: 512
  - name: ibkr
    port: 8080
    cpu: 256
    memory: 512
  - name: twofa
    port: 8080
    cpu: 256
    memory: 512
  - name: ml-predict
    port: 8080
    cpu: 256
    memory: 512

# Observability configuration
observability:
  log_groups:
    agents: []  # Auto-populated from agents list
    mcps: []    # Auto-populated from mcps list
  metrics:
    - TokenCostUSD
    - PipelineStarted
    - PipelineCompleted
    - PipelineFailed
    - AgentLatencyMs

kms:
  platform_artifacts_key_alias: platform-artifacts
  domain_artifacts_key_alias: domain-artifacts

cloudfront:
  enabled: false  # Enable when ready to deploy
  key_pair_id: ""
  private_key_secret_arn: ""

api:
  stage: dev
  throttle_rate: 100
  throttle_burst: 200
  cors_origins:
    - "http://localhost:3000"
    - "https://dashboard.platform.dev"

tags:
  Environment: dev
  Project: agent-infra
  CostCenter: platform-dev
