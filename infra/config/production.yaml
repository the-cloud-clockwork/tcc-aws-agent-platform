# Production environment configuration
# Usage: cdk deploy -c env=production
# WARNING: This deploys production infrastructure.

environment: production
account: "123456789012"
region: eu-west-1
bedrock_region: us-west-2

resource_prefix: "platform"
service_discovery_namespace: "platform.local"
ssm_root_path: "/platform/production"

execution_mode: production

vpc:
  max_azs: 2
  nat_gateways: 2  # HA: one per AZ

scaling:
  fargate:
    min_tasks: 2    # Always-on for production
    max_tasks: 5
    target_cpu_percent: 60
  lambda:
    provisioned_concurrency: 2  # Warm start for hot agents

dynamodb:
  billing_mode: PROVISIONED
  read_capacity: 25   # TODO: tune for production
  write_capacity: 10  # TODO: tune for production
  auto_scaling:
    min_capacity: 5
    max_capacity: 100
    target_utilization: 70

s3:
  intelligent_tiering: true
  removal_policy: RETAIN

logs:
  retention_days: 90  # 3 months for production

mcp_services:
  cpu: 512
  memory_mib: 1024
  desired_count: 2  # HA: minimum 2 tasks

lambda_agents:
  memory_size: 2048  # More memory for production
  timeout_minutes: 15

waf:
  enabled: true
  rate_limit: 500      # Stricter rate limiting
  ip_whitelist:        # SECURITY: Must be actual IPs before go-production
    - "REPLACE_WITH_ACTUAL_IP/32"  # Replace with your static IP or VPN CIDR

secrets:
  rotation_days: 30  # Monthly rotation for production

# Data resources — stacks read from config, not hardcoded
tables:
  artifacts:
    partition_key: artifact_id
  audit_log:
    partition_key: audit_id
    sort_key: timestamp
  prompt_registry:
    partition_key: prompt_id
    sort_key: version
  run_history:
    partition_key: run_date
    sort_key: execution_id
  idempotency:
    partition_key: idempotency_key
    ttl_attribute: expires_at
  risk_state:
    partition_key: PK
    ttl_attribute: expires_at

buckets:
  - artifacts
  - historical-data
  - prompt-registry

agents:
  - name: research
    memory: 2048
    timeout: 900
  - name: strategy
    memory: 2048
    timeout: 900
  - name: recommender
    memory: 2048
    timeout: 900

mcps:
  - name: artifacts
    port: 8000
    cpu: 512
    memory: 1024
  - name: data
    port: 8000
    cpu: 512
    memory: 1024

# Observability configuration
observability:
  log_groups:
    agents: []
    mcps: []
  metrics:
    - TokenCostUSD
    - PipelineStarted
    - PipelineCompleted
    - PipelineFailed
    - AgentLatencyMs

tags:
  Environment: production
  Project: agent-infra
  CostCenter: platform-production

kms:
  platform_artifacts_key_alias: platform-artifacts
  domain_artifacts_key_alias: domain-artifacts

api:
  stage: production
  throttle_rate: 500
  throttle_burst: 100
  cors_origins: []

cloudfront:
  enabled: false
