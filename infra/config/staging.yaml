# Staging environment configuration
# Usage: cdk deploy -c env=staging

environment: staging
account: "835618032093"
region: eu-west-1
bedrock_region: us-west-2

resource_prefix: "platform"
service_discovery_namespace: "platform.local"
ssm_root_path: "/platform/staging"

execution_mode: staging

vpc:
  max_azs: 2
  nat_gateways: 1

scaling:
  fargate:
    min_tasks: 1
    max_tasks: 3
    target_cpu_percent: 65
  lambda:
    provisioned_concurrency: 1  # Warm start for key agents

dynamodb:
  billing_mode: PAY_PER_REQUEST  # On-demand for staging

s3:
  intelligent_tiering: true
  removal_policy: RETAIN

logs:
  retention_days: 30

mcp_services:
  cpu: 512
  memory_mib: 1024
  desired_count: 1

lambda_agents:
  memory_size: 1024
  timeout_minutes: 15

waf:
  enabled: true
  rate_limit: 1000  # Requests per 5 min per IP
  ip_whitelist: []  # No IP restriction for staging

secrets:
  rotation_days: 90

# Data resources — stacks read from config, not hardcoded
tables:
  artifacts:
    partition_key: artifact_id
  audit_log:
    partition_key: audit_id
    sort_key: timestamp
  prompt_registry:
    partition_key: prompt_id
    sort_key: version
  run_history:
    partition_key: run_date
    sort_key: execution_id
  idempotency:
    partition_key: idempotency_key
    ttl_attribute: expires_at
  risk_state:
    partition_key: PK
    ttl_attribute: expires_at

buckets:
  - artifacts
  - historical-data
  - prompt-registry

agents:
  - name: research
    memory: 1024
    timeout: 900
  - name: strategy
    memory: 1024
    timeout: 900
  - name: recommender
    memory: 1024
    timeout: 900

mcps:
  - name: artifacts
    port: 8000
    cpu: 512
    memory: 1024
  - name: data
    port: 8000
    cpu: 512
    memory: 1024

# Observability configuration
observability:
  log_groups:
    agents: []
    mcps: []
  metrics:
    - TokenCostUSD
    - PipelineStarted
    - PipelineCompleted
    - PipelineFailed
    - AgentLatencyMs

tags:
  Environment: staging
  Project: agent-infra
  CostCenter: platform-staging

kms:
  platform_artifacts_key_alias: platform-artifacts
  domain_artifacts_key_alias: domain-artifacts

api:
  stage: staging
  throttle_rate: 500
  throttle_burst: 100
  cors_origins: []

cloudfront:
  enabled: false
