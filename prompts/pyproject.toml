[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prompt-registry"
version = "0.1.0"
description = "Prompt Registry — versioned prompt management service"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "moto[dynamodb,s3]>=5.0",
    "pytest-cov>=5.0",
    "ruff>=0.4,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/prompt_registry"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
