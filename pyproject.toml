[project]
name = "tccw-aws-agent-platform"
version = "0.1.0"
description = "AWS AI Agent Platform — monorepo workspace"
requires-python = ">=3.12"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = [
    "core/tests",
    "prompts/tests",
    "artifacts/tests",
    "cli/tests",
    "infra/tests",
]
asyncio_mode = "auto"

[tool.coverage.run]
source = [
    "core/src",
    "prompts/src",
    "artifacts/src",
    "cli/src",
    "infra/stacks",
    "infra/constructs",
]

[tool.coverage.report]
show_missing = true
fail_under = 80
