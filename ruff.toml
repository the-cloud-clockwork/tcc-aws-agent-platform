target-version = "py312"
line-length = 120

[lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # typer.Argument/Option in defaults — required by typer's design
    "N803",   # DynamoDB Item argument naming convention
    "N818",   # exception naming — existing codebase convention
    "UP042",  # StrEnum migration — deferred (requires Python 3.11+ enum changes)
    "B904",   # exception chaining — deferred to separate cleanup pass
    "SIM108", # ternary operator — readability preference
]

[lint.isort]
known-first-party = ["agent_core", "prompt_registry", "mcp_artifacts", "agent_cli"]

[format]
quote-style = "double"
indent-style = "space"
