sonar.projectKey=tccw-aws-agent-platform
sonar.projectName=TCCW AWS Agent Platform
sonar.organization=The-Cloud-Clock-Work

# Multi-module configuration
sonar.modules=core,prompts,artifacts,cli,infra

# Core module
core.sonar.projectName=agent-core
core.sonar.sources=core/src
core.sonar.tests=core/tests
core.sonar.python.coverage.reportPaths=core/coverage.xml

# Prompts module
prompts.sonar.projectName=prompt-registry
prompts.sonar.sources=prompts/src
prompts.sonar.tests=prompts/tests
prompts.sonar.python.coverage.reportPaths=prompts/coverage.xml

# Artifacts module
artifacts.sonar.projectName=mcp-artifacts
artifacts.sonar.sources=artifacts/src
artifacts.sonar.tests=artifacts/tests
artifacts.sonar.python.coverage.reportPaths=artifacts/coverage.xml

# CLI module
cli.sonar.projectName=agent-cli
cli.sonar.sources=cli/src
cli.sonar.tests=cli/tests
cli.sonar.python.coverage.reportPaths=cli/coverage.xml

# Infra module
infra.sonar.projectName=agent-infra
infra.sonar.sources=infra/stacks,infra/constructs_
infra.sonar.tests=infra/tests
infra.sonar.python.coverage.reportPaths=infra/coverage.xml

# Global settings
sonar.python.version=3.12
sonar.sourceEncoding=UTF-8
sonar.exclusions=**/node_modules/**,**/__pycache__/**,**/cdk.out/**,**/dist/**
