sonar.projectKey=aws-agent-platform
sonar.projectName=AWS Agent Platform

# Multi-module configuration
sonar.modules=core,prompts,artifacts,cli,infra

# Core module
core.sonar.projectName=agent-core
core.sonar.projectBaseDir=core
core.sonar.sources=src
core.sonar.tests=tests
core.sonar.python.coverage.reportPaths=coverage.xml

# Prompts module
prompts.sonar.projectName=prompt-registry
prompts.sonar.projectBaseDir=prompts
prompts.sonar.sources=src
prompts.sonar.tests=tests
prompts.sonar.python.coverage.reportPaths=coverage.xml

# Artifacts module
artifacts.sonar.projectName=mcp-artifacts
artifacts.sonar.projectBaseDir=artifacts
artifacts.sonar.sources=src
artifacts.sonar.tests=tests
artifacts.sonar.python.coverage.reportPaths=coverage.xml

# CLI module
cli.sonar.projectName=agent-cli
cli.sonar.projectBaseDir=cli
cli.sonar.sources=src
cli.sonar.tests=tests
cli.sonar.python.coverage.reportPaths=coverage.xml

# Infra module
infra.sonar.projectName=agent-infra
infra.sonar.projectBaseDir=infra
infra.sonar.sources=stacks,constructs_
infra.sonar.tests=tests
infra.sonar.python.coverage.reportPaths=coverage.xml

# Global settings
sonar.python.version=3.12
sonar.sourceEncoding=UTF-8
sonar.exclusions=**/node_modules/**,**/__pycache__/**,**/cdk.out/**,**/dist/**
